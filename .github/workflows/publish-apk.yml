name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate and Publish Prebuilt Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate prebuilt APK and checksum
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Missing or empty APK at $APK_PATH"
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ] || [ ! -s "$SHA_PATH" ]; then
            echo "::error::Missing or empty checksum file at $SHA_PATH"
            exit 1
          fi

          ACTUAL_SIZE=$(stat -c '%s' "$APK_PATH")
          if [ "$ACTUAL_SIZE" -lt 1000000 ]; then
            echo "::error::APK file is suspiciously small ($ACTUAL_SIZE bytes); possible Git LFS pointer or truncation."
            exit 1
          fi

          MAGIC=$(head -c 4 "$APK_PATH" | od -An -tx1 | tr -d ' \n')
          if [ "$MAGIC" != "504b0304" ]; then
            echo "::error::APK does not start with ZIP PK header (got $MAGIC)."
            exit 1
          fi

          RECORDED_SHA=$(awk 'NR==1 {print $1}' "$SHA_PATH")
          ACTUAL_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')

          if [ -z "$RECORDED_SHA" ] || [ "$RECORDED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::SHA-256 mismatch! Recorded=$RECORDED_SHA Actual=$ACTUAL_SHA"
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)

          if ! unzip -tq "$APK_PATH"; then
            echo "::error::APK ZIP archive integrity check failed."
            exit 1
          fi

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "${ANDROID_SDK_ROOT}/build-tools" ]; then
            BUILD_TOOLS=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n 1)
            if [ -x "$BUILD_TOOLS/apksigner" ]; then
              "$BUILD_TOOLS/apksigner" verify --verbose "$APK_PATH"
            fi
          fi

          APK_BYTES=$(stat -c '%s' "$APK_PATH")
          APK_HUMAN=$(ls -lh "$APK_PATH" | awk '{print $5}')

          echo "sha256=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_human=$APK_HUMAN" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK_SHA="${{ steps.validate.outputs.sha256 }}"
          APK_BYTES="${{ steps.validate.outputs.size_bytes }}"
          APK_HUMAN="${{ steps.validate.outputs.size_human }}"

          NOTES_FILE=$(mktemp)
          printf '%s\n' \
            "Prebuilt debug APK compiled inside Google AI Studio." \
            "" \
            "- **Asset:** \`app-debug.apk\`" \
            "- **Size:** ${APK_HUMAN} (${APK_BYTES} bytes)" \
            "- **SHA-256:** \`${APK_SHA}\`" \
            "- **Direct Latest Download:** https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk" \
            > "$NOTES_FILE"

          RELEASE_URL=$(gh release create "$RELEASE_TAG" \
            "apk-distribution/app-debug.apk" \
            --title "Debug APK (${RELEASE_TAG})" \
            --notes-file "$NOTES_FILE" \
            --latest)

          rm -f "$NOTES_FILE"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.release.outputs.release_tag }}"
          RELEASE_URL="${{ steps.release.outputs.release_url }}"
          APK_SHA="${{ steps.validate.outputs.sha256 }}"
          APK_BYTES="${{ steps.validate.outputs.size_bytes }}"
          APK_HUMAN="${{ steps.validate.outputs.size_human }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          {
            echo "## Debug APK Release Published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release Tag | \`${RELEASE_TAG}\` |"
            echo "| Asset Filename | \`app-debug.apk\` |"
            echo "| APK Size | ${APK_HUMAN} (${APK_BYTES} bytes) |"
            echo "| SHA-256 | \`${APK_SHA}\` |"
            echo "| GitHub Release Page | ${RELEASE_URL} |"
            echo "| Direct Latest Download URL | ${DIRECT_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
